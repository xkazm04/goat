# .ai/manifest.yaml — the agent-facing contract for this repo.
# Capabilities are tool-NEUTRAL (a name -> the command that fulfils it) and unknown fields MUST be
# ignored — so this survives tool churn and schema growth.
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-24"
# context_map.json was listed here but was deleted from the repo in 2026-03 and is
# gitignored; nothing generates it. Removed rather than left pointing at nothing.
generatedFrom: [package.json, CLAUDE.md]

repo:
  name: goat
  purpose: "G.O.A.T. — Next.js app for building and ranking custom top-N lists via a drag-and-drop match grid"
  languages: [typescript]

# Capabilities, not tools. Add keys freely; older readers ignore unknown ones.
# `verified` is a claim a doctor flips to true once it has actually run the command.
# Every command below exists in package.json scripts (or is tsc against the repo's tsconfig.json).
capabilities:
  dev: { command: "npm run dev", verified: false }
  build: { command: "npm run build", verified: false }
  start: { command: "npm start", verified: false }
  # Was "next lint", which Next 16 removed: it parsed "lint" as a directory and
  # exited 1 having linted nothing. Now invokes eslint directly. Ran 2026-08-24.
  lint: { command: "npm run lint", verified: true, verifiedAt: "2026-08-24" }
  # Holds the metrics that cannot be zeroed today. Exit 1 = a bucket diverged;
  # exit 2 = the instrument could not run, which is neither pass nor fail.
  lint-ratchet: { command: "npm run lint:ratchet", verified: true, verifiedAt: "2026-08-24" }
  typecheck: { command: "npm run typecheck", verified: true, verifiedAt: "2026-08-24" }
  docs-store-graph: { command: "npm run docs:store-graph", verified: true, verifiedAt: "2026-08-24" }
  # The source->doc coupling map and its reader, added 2026-08-24. Two modes:
  # bare = is the MAP honest (no stale glob, no missing reference doc);
  # --changed = does this CHANGE settle what it owes, read from the git diff.
  docs-coupling: { command: "npm run docs:coupling", verified: true, verifiedAt: "2026-08-24" }
  # The findings ledger: identity, state and regression probes for the 190
  # findings in docs/harness/ui-bug-combined-2026-06-16/, which had none.
  findings: { command: "npm run findings", verified: true, verifiedAt: "2026-08-24" }
  findings-check: { command: "npm run findings:check", verified: true, verifiedAt: "2026-08-24" }
  docs-coupling-same-change:
    { command: "npm run docs:coupling -- --changed --base <ref>", verified: true, verifiedAt: "2026-08-24" }
  # `test` is the unit runner (vitest), added 2026-08-24. The browser suite keeps
  # its own capability name so a green report always says which population ran.
  test: { command: "npm test", verified: true, verifiedAt: "2026-08-24" }
  test-e2e: { command: "npm run test:e2e", verified: false }
  test-ui: { command: "npm run test:e2e:ui", verified: false }
  storybook: { command: "npm run storybook", verified: false }
  build-storybook: { command: "npm run build-storybook", verified: false }

# What a green run of the above actually means. A capability that exists is not a
# gate; recording the difference is the point.
capabilityNotes:
  unit-test: >-
    vitest, added 2026-08-24 (vitest.config.ts). 79 tests over the store-registry
    manifest + its derivations, the tier-boundary conventions, and the depth
    tokens. Every suite carries a recorded negative control in its header
    comment. `passWithNoTests: false`, so a run that executed zero files is red.
  lint: >-
    Two tiers since 2026-08-24. 44 correctness rules are `error` — each measured
    at 0 findings before promotion, so `npm run lint` now HAS an input that makes
    it exit non-zero (proved: a seeded file with a conditional hook, a duplicate
    object key and an invalid typeof gave 3 errors / exit 1). Everything with a
    legacy population stays `warn` and is held by lint-ratchet instead.
  lint-ratchet: >-
    Symmetric per-rule ratchet over .ai/ratchet-baseline.json — fails on a rise
    AND on an unexplained drop. Baseline 2026-08-24: 24 buckets, 750 findings,
    981 files walked. Proved red four ways (rise, drop, broken-instrument
    could-not-run, and green when matching).
  typecheck: >-
    23 pre-existing errors as of 2026-08-24, counted over SOURCE only —
    12 in the consensus route, 6 in ranking-store, 5 in bracket components.
    `tsc --noEmit` itself reports 29 in a tree where `next dev` has run,
    because tsconfig deliberately includes .next/types/**; those 6 generated
    errors are excluded from the count so the number does not depend on whether
    someone started the dev server. Still not a clean baseline, but it is now
    PINNED: a 24th source error fails `npm run lint:ratchet`.
  gates: >-
    CI added 2026-08-24: .github/workflows/gates.yml runs on push to main and on
    every pull request. Four jobs, all blocking, all with deterministic input
    (the tree plus the committed lockfile): unit tests, lint, ratchet, and the
    generated store-graph --check. `typecheck` reports rather than blocks
    because its 29 inherited errors are debt-shaped, not input-shaped — the
    count is pinned by the ratchet's typecheck:errors bucket instead, and the
    written promotion trigger is "when that bucket reaches 0, delete it and run
    tsc bare". Still no git hooks and no lint-staged; the commit rung remains
    unguarded and that is a deliberate, dated gap.
  docs-coupling: >-
    Added 2026-08-24. .ai/doc-coupling.json is the ONE authority for which
    document a source area owes; scripts/doc-coupling.mjs is its only reader (a
    map with no reader is a good intention in a syntax that parses). Before it,
    this repo declared exactly one coupling and carried 69 markdown files nobody
    could attribute to any source.
    COVERAGE mode fails on a broken entry — a source glob matching nothing live,
    or a reference document not on disk — and REPORTS the residue: 7 of 80 areas
    mapped, 4 exempt with a written reason, 69 unmapped. That residue is a
    ratchet bucket (docs:unmappedAreas), not a bar to clear: nobody is writing 69
    documents this month, but the 70th area cannot arrive unnoticed.
    SAME-CHANGE mode reads the git diff with rename detection (never a
    transcript, never a list of editor destinations) and is satisfied only by the
    exact document the entry names — a prefix-shaped satisfaction is discharged
    by accident. Dismissal is first-class and leaves an artifact: a
    `Docs-dismissed: <why>` commit trailer, countable from git history.
    Proved red seven ways before being trusted: unsettled obligation (exit 1),
    stale source glob (1), missing reference doc (1), stale allowlist entry (1),
    unparseable map (exit 2), zero-area walk under the floor (2), and green when
    everything resolves (0). On its very first real run it found three genuine
    obligations in its own change — the manifest, CLAUDE.md and the ratchet
    baseline — all of which were settled rather than dismissed.
  findings: >-
    Added 2026-08-24. Before it, docs/harness/ui-bug-combined-2026-06-16/ was a
    dead snapshot: 190 findings plus 19 FIXES-WAVE documents claiming closures,
    with no dedup key, no notion of "fixed", no verification and no expiry — a
    scanner output that could not tell progress from churn. `.ai/findings.json`
    is now a DERIVED ledger (`npm run findings:ingest` recomputes it from those
    reports; `--check` re-derives and refuses any divergence). Identity is
    sha256(contextSlug | anchorFile | titleSlug) — the anchor FILE, never the
    LINE, so a judged finding survives edits above its match site; 14 hand-written
    verdicts were carried across a re-derivation to prove it.
    Six findings are `fixed` — each RE-READ in the tree today rather than believed
    from the fix log — and each carries a regression probe the CI check runs.
    Five are `suppressed` under the operator's dated auth deferral, with owner and
    revisit horizon: suppression is a verdict with provenance, and the finding
    stays visible. Three are `needs-reanchor` (anchor file gone), deliberately NOT
    "cleared": a deleted file and a repaired defect look identical from the ledger.
    Proved red six ways: probe regression (1), state outside the vocabulary (1),
    suppressed with no reason (1), fixed with no fixedIn (1), ledger drifting from
    an edited report (1), and corpus/parser shrink (exit 2 — could not run).
    Its own first negative control caught a probe that could NOT go red: an
    unanchored /function getStudioItemId/ still matched after the symbol was
    renamed. That is recorded on the probe.
    NOT joined: 8 of 90 closure references in the FIXES-WAVE documents cannot be
    resolved to a context, and the ingester refuses to guess. A fuzzy join would
    make the ledger confidently wrong, which is worse than the snapshot.
  supply-chain: >-
    ABSENT, deliberately. An advisory-feed check reads an input that moves
    without this repository, so it must not block: a advisory published
    overnight would wall the next unrelated PR. Adding one requires a scheduled
    trigger and a named reader first (quality-gates/blocking-by-input-determinism).

# Pointers — these subsystems can change format underneath without breaking this contract.
paths:
  docs: docs/
  e2e: e2e/
  stores: src/stores/
  storeTopology: src/stores/registry.ts
  conformance: .ai/registry-conformance.md

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
# registered from the secondary machine (mkdol) 2026-08-24
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
  machine: secondary
  contributor: mkdol-dev-box
knowledge:
  domains: [software-engineering, media-generation]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored, made by ai-registry/scripts/link-skills.mjs); THIS list is the
# reviewable declaration. A skill not listed here is project-owned and lives in
# .claude/skills/ as a real directory.
skills:
  - architect
  - conform
  - consult
  - explorer
  - research
  - ship-loop
  - motionize
  - npm-updates
  - tiger
  - uat
