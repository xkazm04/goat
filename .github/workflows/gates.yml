# Quality gates. Three jobs, each a function of the tree and the committed
# lockfile, so the same commit gives the same answer next month and a blocking
# job is a promise the author can keep. There is deliberately no advisory-feed
# job: that input moves on its own and would wall unrelated pull requests.
#
#   check   typecheck and lint
#   unit    vitest (the list reducer, projections, DNA math, AI schema parsing,
#           publishing, and the migration chain)
#   smoke   Playwright against a dev server with no database and the fixture AI
#           provider: create a list, rank in every mode, the critic, the taste
#           card, and the framing rule. CI never calls Claude.

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, the resolver that wrote package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # passWithNoTests is false: a run that executed zero files fails.
      - run: npm test

  smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
